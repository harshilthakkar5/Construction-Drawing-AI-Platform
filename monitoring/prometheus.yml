# Local Prometheus config: the API and worker run on the HOST (npm/python)
# while Prometheus runs in Docker, so targets go through host.docker.internal
# (mapped via extra_hosts in docker-compose.yml).
#
# In production (App Platform/DOKS) point these targets at the api and worker
# services instead — see README "Monitoring".
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: cdip-api
    static_configs:
      - targets: ["host.docker.internal:9464"]
  - job_name: cdip-worker
    static_configs:
      - targets: ["host.docker.internal:9465"]
